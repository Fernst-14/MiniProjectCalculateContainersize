<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Learn JAvaScript</h1>
    <p id="text"></p>

    <input type="text" id="input">

    <button onclick="ShowData()">Click Me</button>

    <script>
        document.getElementById("text").innerHTML = "Hello Fern";

        function ShowData() {
            // ดึงค่าจาก input ผ่าน id
            let inputValue = document.getElementById("input").value;

            // ตรวจสอบว่าผู้ใช้กรอกข้อมูลมาหรือไม่
            if (inputValue.trim() !== "") {
                alert("Your input: " + inputValue);
            } else {
                alert("Please enter some text!");
            }
        }
    </script>
</body>
</html>
